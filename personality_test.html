<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
  
</head>
<body class="personality_body">
  
<div>

   <h2>Question 1</h2>
   <h3 id = "question1" class="question1">Whats your favorite season?</h3>
   <button id = "a0" class="spring" data-q="1" data-choice="0"> Spring </button>
   <button id = "a1" class="summer" data-q="1" data-choice="1"> Summer</button>
   <button id = "a2" class="fall" data-q="1" data-choice="2"> Fall </button>
   <button id = "a3" class="winter" data-q="1" data-choice="3"> Winter </button>

 <h2>Question 2</h2>
   <h3 id = "data-q" class="question2"> What's your ideal way to spend a free afternoon?</h3>
   <button id = "a4" class="explore" data-q="2" data-choice="0"> Going out and exploring somewhere new </button>
   <button id = "a5" class="stay" data-q="2" data-choice="1"> Staying in and watching movies or gaming </button>
   <button id = "a6" class="friends" data-q="2" data-choice="2"> Hanging out with friends somewhere casual</button>
   <button id = "a7" class="creative" data-q="2" data-choice="3"> Doing something creative or working on a hobby </button>

   <h2>Question 3</h2>
   <h3 id = "question3" class="question3">How would your friends describe you?</h3>
   <button id = "a8" class="outgoing" data-q="3" data-choice="0"> Outgoing and talkative</button>
   <button id = "a9" class="quiet" data-q="3" data-choice="1"> Quiet at first, but funny once comfortable </button>
   <button id = "a10" class="kind" data-q="3" data-choice="2"> Kind, supportive, and a good listener</button>
   <button id = "a11" class="random" data-q="3" data-choice="3"> Random, energetic, and a little chaotic</button>
   

</div>
<script src="quiz.js"></script>
</body>
</html>
